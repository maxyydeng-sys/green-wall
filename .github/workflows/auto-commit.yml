name: auto-commit

on:
  schedule:
    # UTC → Asia/Shanghai 11:17 / 15:17，避开整点高峰。
    - cron: '17 3 * * *'
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '目标日期 YYYY-MM-DD（留空为今天）；回填会明确标记'
        required: false
        type: string
      dry_run:
        description: '只演练，不生成记录、不提交、不推送'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: auto-commit
  cancel-in-progress: false

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 确认手动触发使用默认分支
        env:
          EVENT: ${{ github.event_name }}
          SELECTED: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$SELECTED" != "$DEFAULT_BRANCH" ]; then
            echo '请在 Run workflow 中选择仓库默认分支。' >&2
            exit 1
          fi

      - name: 检出默认分支
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 运行自动提交系统
        env:
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [ -n "${INPUT_DATE:-}" ]; then
            FLAGS+=(--date "$INPUT_DATE")
          fi
          if [ "${INPUT_DRY_RUN:-}" = "true" ]; then
            FLAGS+=(--dry-run)
          fi
          node scripts/green-wall.mjs run "${FLAGS[@]}" --json | tee "$RUNNER_TEMP/summary.json"

      - name: 写入运行摘要
        if: always()
        env:
          SUMMARY_PATH: ${{ runner.temp }}/summary.json
        run: node scripts/summary.mjs --to-step-summary

      - name: 保留诊断结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: green-wall-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/summary.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
